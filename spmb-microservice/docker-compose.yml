services:
  pendaftaran-maba:
    build:
      context: ./pendaftaran-maba-service
      dockerfile: Dockerfile
    container_name: pendaftaran-maba-service
    ports:
      - "5001:5001"
    volumes:
      - maba-data:/app/data
    environment:
      - FLASK_ENV=production
      - DB_FILE=/app/data/database.db
    networks:
      - spmb-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-utbk:
    build:
      context: ./admin-utbk-service
      dockerfile: Dockerfile
    container_name: admin-utbk-service
    ports:
      - "5000:5000"
    volumes:
      - utbk-data:/app/data
    environment:
      - FLASK_ENV=production
      - DB_FILE=/app/data/database.db
      - MABA_SERVICE_URL=http://pendaftaran-maba:5001
    depends_on:
      pendaftaran-maba:
        condition: service_healthy
    networks:
      - spmb-network

networks:
  spmb-network:
    driver: bridge
volumes:
  maba-data:
  utbk-data:
