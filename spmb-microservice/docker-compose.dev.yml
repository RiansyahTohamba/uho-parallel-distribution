services:
  pendaftaran-maba:
    build:
      context: ./pendaftaran-maba-service
      dockerfile: Dockerfile
    container_name: pendaftaran-maba-service-dev
    ports:
      - "4001:5001"
    volumes:
      - ./pendaftaran-maba-service:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    networks:
      - spmb-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-utbk:
    build:
      context: ./admin-utbk-service
      dockerfile: Dockerfile
    container_name: admin-utbk-service-dev
    ports:
      - "4467:5000"
    volumes:
      - ./admin-utbk-service:/app
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      - MABA_SERVICE_URL=http://pendaftaran-maba:5001
    depends_on:
      pendaftaran-maba:
        condition: service_healthy
    networks:
      - spmb-network

networks:
  spmb-network:
    driver: bridge
